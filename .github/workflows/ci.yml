name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Offline-Tests brauchen weder die Embedding-Modelle noch die claude-CLI,
      # daher nur die leichten Laufzeit-Abhaengigkeiten installieren.
      - run: pip install pymupdf pyyaml "sqlite-vec==0.1.9" python-docx pytest
      - run: python -m pytest
